<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Ham Ops Console · Propagation</title>
<link rel="stylesheet" href="/static/home.css">
<link rel="stylesheet" href="/static/propagation.css">
</head>
<body data-page="propagation">
<!-- Ham Ops Console -- Propagation page, built from the approved mockup "Propagation
     page" (2026-10-12): band conditions good -> fair -> poor, and the solar and
     geomagnetic figures. All data comes from the console service on this Pi; see
     common.js and propagation.js. -->
<div class="screen">

  <header class="status-bar">
    <div class="clock"><span class="utc num" id="utc">--:--Z</span><span class="local" id="local">--</span></div>
    <span class="mode-tag" id="mode">--</span>
    <span class="station" id="station">--</span>
    <div class="spacer"></div>
    <div class="pills">
      <span class="pill" id="pill-internet"><span class="dot"></span>Internet</span>
      <span class="pill" id="pill-nas"><span class="dot"></span>NAS</span>
      <span class="pill" id="pill-gps"><span class="dot"></span><span class="label">GPS</span></span>
    </div>
  </header>

  <nav class="modules" aria-label="Modules">
    <button data-href="/">Home</button>
    <button class="current" aria-current="page">Propagation</button>
    <button data-href="/weather">Weather</button>
    <button disabled id="alerts-button">Alerts<span class="soon">Coming</span><span class="badge" id="badge" hidden></span></button>
    <button disabled>System<span class="soon">Coming</span></button>
  </nav>

  <div class="pr-body">

    <section class="tile pr-bands" id="t-bands" aria-label="Band conditions">
      <div class="tile-head"><span class="name" id="bands-title">BAND CONDITIONS · NOW</span><span class="fresh" id="bands-fresh">--</span></div>
      <span class="best" id="best">--</span>
      <div class="band-grid" id="band-grid"></div>
      <span class="small" id="bands-note">Band ratings from PropMon</span>
    </section>

    <div class="pr-side">
      <section class="tile pr-solar" id="t-solar" aria-label="Solar and geomagnetic">
        <div class="tile-head"><span class="name">SOLAR AND GEOMAGNETIC</span></div>
        <dl class="solar" id="solar"></dl>
        <p class="recovery" id="recovery" hidden></p>
      </section>
      <button class="muf" disabled><span>MUF map</span><span class="soon">Coming</span></button>
    </div>

  </div>

  <footer class="toolbar">
    <button id="refresh">Refresh</button>
    <button disabled>Settings<span class="soon">Coming</span></button>
    <button disabled>Sleep<span class="soon">Coming</span></button>
    <button disabled>Help<span class="soon">Coming</span></button>
    <div class="spacer"></div>
    <button class="shutdown" disabled>Shut down…<span class="soon">Coming</span></button>
  </footer>

</div>
<div class="service-down" id="service-down" hidden>Console service not answering. Data on screen may be old. NWS alerts: check NOAA Weather Radio.</div>
<script src="/static/common.js"></script>
<script src="/static/propagation.js"></script>
</body>
</html>
